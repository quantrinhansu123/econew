# Render Blueprint — https://github.com/quantrinhansu123/econew
# Dashboard: New > Blueprint > connect repo, Root Directory = server (or deploy Web Service manually)

services:
  - type: web
    name: eco-transport-api
    runtime: node
    rootDir: server
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node --max-old-space-size=192 dist/scripts/run-migrations.js && exec node --max-old-space-size=320 dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_POOLER_DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: eco-transport
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGIN
        value: https://eco-webapp.vercel.app
      - key: DB_POOL_MAX
        value: "3"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
